# Frozen configuration for the benchmark reported in the manuscript.
master_seed: 20260815

node_sizes:
  - 4
  - 6
  - 8
  - 10
  - 12

graphs:
  erdos_renyi:
    instances_per_n: 10
    probability: 0.5
  random_regular:
    instances_per_n: 10
    degree: 3
    # n=4 would reproduce K4, already present as the complete-graph control.
    omit_n:
      - 4
  complete:
    instances_per_n: 1

ansatze:
  principal:
    - ry
    - agnostic_xx
  controls:
    - rx
    - ryrz
  qaoa_depths:
    - 1
    - 3
    - 5
  # Add p=n/2 when it is not already one of the fixed depths, so 2p=n.
  qaoa_parameter_matched: true

optimizer:
  name: COBYLA
  max_evaluations: 1000
  rhobeg: 1.0
  tol: 0.0001

restarts: 5
primary_evaluation: exact_statevector
checkpoints:
  - 50
  - 100
  - 250
  - 500
  - 1000
success_threshold: 0.99

classical_baselines:
  single_flip_local_search: true
  random_cut_reference: true
